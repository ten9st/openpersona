
services:
  frontend:
    build:
      context: ..
      dockerfile: infra/frontend/Dockerfile
    container_name: openpersona_frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: infra/backend/Dockerfile
    container_name: openpersona_backend
    working_dir: /app
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      APP_NAME: OpenPersona
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: openpersona
      DB_USERNAME: openpersona
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      SESSION_DOMAIN: localhost
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:3000,127.0.0.1,127.0.0.1:3000
    command: >
      sh -c "composer install &&
      if [ ! -f .env ]; then cp .env.docker.example .env && php artisan key:generate; fi &&
      php artisan migrate --force &&
      php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: openpersona_db
    environment:
      POSTGRES_DB: openpersona
      POSTGRES_USER: openpersona
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - openpersona_db_data:/var/lib/postgresql/data

volumes:
  openpersona_db_data:
  frontend_node_modules: